apis:
- aid: northern-powergrid:northern-powergrid-open-data-explore-api
  name: Northern Powergrid Open Data Explore API
  description: >-
    The current Opendatasoft Explore REST API (v2.1) over Northern Powergrid's open data portal. Read
    only, GET only, JSON only, driven by the Opendatasoft Query Language (ODSQL). Sixteen documented
    paths cover catalog search, dataset metadata, facets, record retrieval, attachments, DCAT-AP
    catalogue export and per-dataset exports to CSV, Parquet and GPX. Confirmed answering anonymously
    on 2026-07-27 — the catalog reports 102 datasets and the live power cuts dataset returned 229 open
    incidents in real time. Anonymous callers get 5,000 requests per day (observed
    x-ratelimit-limit: 5000, resetting daily); an optional apikey query parameter from a free portal
    account raises the allowance and unlocks the datasets whose records are hidden from anonymous
    callers.
  humanURL: https://northernpowergrid.opendatasoft.com/api/explore/v2.1/console
  baseURL: https://northernpowergrid.opendatasoft.com/api/explore/v2.1
