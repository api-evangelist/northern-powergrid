name: Northern Powergrid
kind: company
description: >-
  Northern Powergrid is the electricity distribution network operator (DNO) for the North East of
  England, Yorkshire and northern Lincolnshire, owning and running the poles, wires, substations and
  low-voltage network that deliver power to 4 million homes and businesses across roughly 10,000 square
  miles. It is a Berkshire Hathaway Energy company and it does not sell electricity — it moves it,
  so it holds no retail customer accounts and no billing relationship. Its API posture reflects that
  split exactly: the market and network side is genuinely open, with a live Opendatasoft-hosted open
  data portal publishing 102 datasets under the Northern Powergrid Open Data Licence v1.0 and a fully
  documented Explore REST API that answers anonymously at 5,000 requests a day, including live power
  cut incidents, operational metering, embedded capacity registers, network capacity headroom and
  aggregated smart meter consumption; the consumer side is empty, because Britain has no energy
  consumer data right equivalent to the Australian Consumer Data Right and a DNO would not be the
  obligated party if it did. The open data programme exists because Ofgem's Data Best Practice
  Guidance is a licence condition under the RIIO-ED2 price control, and unlike many mandates in this
  sector it is visibly implemented rather than merely claimed. Roughly 44 of the 102 datasets are
  metadata-visible but records-gated to anonymous callers and require a free self-serve portal
  registration to read.
