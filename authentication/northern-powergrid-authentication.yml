note: >-
  The OpenAPI declares only the apikey query-parameter scheme. The platform's own reference
  documentation for this API documents two further mechanisms the spec omits: the same API key
  passed in an Authorization header (the vendor's recommended form), and a full OAuth 2.0
  authorization-code flow with refresh tokens. Both were verified live against this portal on
  2026-07-27 — GET /oauth2/authorize/ returned 302 and POST-only /oauth2/token/ returned 405 to a
  GET. Anonymous access needs no credential at all: the catalogue and most datasets answer
  unauthenticated at 5,000 requests a day.
