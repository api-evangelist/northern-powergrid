schemes:
- name: anonymous
  type: none
  description: >-
    No credential required. The catalogue, dataset metadata, facets and the records of the datasets
    Northern Powergrid publishes openly all answer to unauthenticated callers, subject to the
    anonymous daily quota. Roughly 44 of the 102 datasets are metadata-visible but records-gated and
    return no rows to anonymous callers.
  sources:
