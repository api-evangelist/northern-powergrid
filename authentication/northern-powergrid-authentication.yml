- name: apikey-header
  type: http
  scheme: Apikey
  in: header
  parameter: Authorization
  format: "Authorization: Apikey <API_KEY>"
  description: >-
    The platform's recommended way to pass the API key, documented but absent from the OpenAPI.
    Preferred over the query parameter because headers are not retained in browser history or
    server logs.
  recommended: true
  sources:
  - https://help.huwise.com/apis/ods-explore-v2/#section/Authentication/Providing-API-keys-within-requests
- name: oauth2
  type: oauth2
  description: >-
    OAuth 2.0 authorization-code flow for third-party applications acting on behalf of a portal user.
    RFC 6749 compliant, bearer tokens per RFC 6750. Applications are registered per domain from the
    account "My applications" tab; authorization codes expire after 1 hour and are exchanged for a
    bearer token plus a refresh token.
  flows:
  - flow: authorizationCode
    authorizationUrl: https://northernpowergrid.opendatasoft.com/oauth2/authorize/
    tokenUrl: https://northernpowergrid.opendatasoft.com/oauth2/token/
    refresh: true
    client_types: [confidential, public]
    scopes: [all]
  sources:
  - https://help.huwise.com/apis/ods-explore-v2/#section/Authentication/Using-OAuth2-authorization
