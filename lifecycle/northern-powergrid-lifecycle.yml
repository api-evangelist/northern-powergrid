summary: >-
  This API has a real, written versioning and deprecation policy — inherited from the Opendatasoft
  platform rather than authored by Northern Powergrid, but binding on this endpoint and verifiable
  from its response headers. What it does not have is a status page: no status.opendatasoft.com and
  no portal status page answered, so uptime transparency is the gap.
versioning:
  scheme: uri-path
  current: v2.1
  current_status: stable, production ready — no future breaking change promised
  previous: v2.0
  previous_status: still served at /api/explore/v2.0 and still publishing its own OpenAPI
  docs: https://help.huwise.com/apis/ods-explore-v2/#section/Versioning
  guarantees:
  - ODSQL is backward compatible — new syntax never replaces existing syntax
  - response bodies are stable — keys may be added, never renamed or removed
  - URLs and endpoints are stable
  breaking_change_rule: >-
    Any violation of the three guarantees above is only ever shipped as a new API version at a new
    stable URL, with its own exhaustive documentation and a widely communicated release note.
deprecation:
  policy_url: https://help.huwise.com/apis/ods-explore-v2/#section/Versioning
  sunset_header: false
  rfc8594: false
  deprecation_header: ODS-Explore-API-Deprecation
  deprecation_header_format: "<FEATURE_ID>: deprecation message (multiple messages separated by ';')"
  deprecation_header_example: "DATE_KEYS_AS_ISOFORMAT: Dates used in group keys are currently returned as timestamps and will be returned as standard formatted date strings in the next API version"
  link_header: >-
    The Link header on a response carries the URL of the version changelog, so a client that notices
    a deprecation message can follow the header straight to the migration notes.
  cors_exposed: true
  detail: >-
    Feature-level deprecation is signalled in-band on live responses, and responses from a superseded
    major version carry the header too. This is a stronger machine-readable signal than most open
    data APIs manage, though it is a vendor-specific header rather than RFC 8594 Deprecation/Sunset.
