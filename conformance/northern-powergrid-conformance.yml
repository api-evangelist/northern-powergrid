note: >-
  This is an assertion of which cross-cutting and sector standards the API demonstrably conforms to,
  each with the evidence that supports it. Nothing here is a certification claim — Northern Powergrid
  publishes no trust centre and no audited compliance programme for this API, and none was inferred.
standards:
- id: openapi-3.0
  conforms: true
  evidence: Both live versions publish OpenAPI 3.0.3 documents at /api/explore/v2.x/swagger.json.
- id: rest
  conforms: true
  evidence: Resource-oriented, hierarchical GET-only paths returning JSON.
- id: oauth2
  conforms: true
  evidence: >-
    Authorization-code flow documented as RFC 6749 compliant with RFC 6750 bearer tokens;
    /oauth2/authorize/ (302) and /oauth2/token/ (405 to GET, POST-only) both answer on this host.
- id: oauth2-rfc8414-discovery
  conforms: false
  evidence: /.well-known/oauth-authorization-server returns 404 — the OAuth endpoints are documented, not discoverable.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404; no OIDC surface documented.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a custom {error_code, message} envelope served as application/json, not
    application/problem+json.
- id: rfc9116-security-txt
  conforms: true
  evidence: >-
    /.well-known/security.txt returns 200 with Contact and Expires fields — published by the platform
    operator (security@opendatasoft.com), not by Northern Powergrid.
- id: rfc8594-deprecation-header
  conforms: false
  evidence: >-
    Deprecation is signalled, but through the vendor header ODS-Explore-API-Deprecation rather than
