sector_standards:
- id: ofgem-data-best-practice
  conforms: true
  evidence: >-
    The open data programme is delivered under Ofgem's Data Best Practice Guidance, a licence
    condition of the RIIO-ED2 price control. Unlike much of the sector this is visibly implemented —
    102 datasets, an open licence, a documented API and an anonymous quota — rather than only claimed.
  regime: GB electricity distribution (Ofgem / RIIO-ED2)
- id: uk-open-government-licence
  conforms: false
  evidence: >-
    Data is published under the Northern Powergrid Open Data Licence v1.0, a bespoke licence, not
    under OGL v3.0.
  licence_url: https://northernpowergrid.opendatasoft.com/p/opendatalicence/
- id: cim-iec-61968
  conforms: false
  evidence: >-
    Datasets are published as flat tabular/geospatial resources, not as IEC Common Information Model
    payloads. No CIM, no ENA Open Networks data model.
- id: consumer-data-right
  conforms: false
  applicable: false
  evidence: >-
    Great Britain has no energy consumer data right equivalent to the Australian CDR, and a
    distribution network operator would not be the obligated party if it did — Northern Powergrid
    holds no retail accounts. Recorded as not applicable rather than as a failure.
