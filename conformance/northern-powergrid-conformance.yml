- id: json-api
  conforms: false
  evidence: Responses are plain JSON with a links array, not JSON:API documents.
- id: hateoas
  conforms: partial
  evidence: >-
    Every response carries a links array of relations for navigating the endpoint hierarchy, and the
    Link header is used for changelog discovery — hypermedia navigation without a formal media type.
- id: dcat-ap
  conforms: true
  evidence: >-
    exportCatalogDCAT serves the whole catalogue as RDF/XML DCAT-AP at
    /api/explore/v2.1/catalog/exports/dcat, with a dcat_ap_format path segment for profile variants.
    This is the interoperability standard that matters most for a public-sector open data catalogue.
- id: geojson
  conforms: true
  evidence: GeoJSON is a documented export format; geo_point_2d/geo_shape field types appear in live dataset schemas.
- id: gpx
  conforms: true
  evidence: exportRecordsGPX serves dataset records as GPX.
- id: apache-parquet
  conforms: true
  evidence: exportRecordsParquet serves dataset records as Parquet — a real analytics-grade bulk path.
- id: csv-rfc4180
  conforms: partial
