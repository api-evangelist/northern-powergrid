agent_notes:
  safety: Every operation is a GET. There is no write path, so no tool in this set can mutate anything
    and all of them are safe to retry. The only budget to respect is the daily request quota.
  first_step: Always resolve a dataset_id through search_datasets and read its field list through get_dataset
    before composing a where or select clause — the per-dataset schema is runtime data, not contract.
  bulk: Prefer export_dataset over paging query_records; exports carry no result cap.
