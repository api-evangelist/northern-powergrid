note: >-
  The published OpenAPI declares response codes but attaches no schemas and no examples to any of
  them, so there is nothing to harvest from the spec. These are real request/response pairs captured
  live and unauthenticated against Northern Powergrid's production catalogue — abridged where a
  response was long, never edited or invented. Every one is reproducible today with curl and no
  credential.
api: openapi/northern-powergrid-open-data-explore-api-v2-1-openapi.json
base_url: https://northernpowergrid.opendatasoft.com/api/explore/v2.1
auth: none required
examples:
- name: Count the catalogue
  operationId: getDatasets
  request:
    method: GET
    path: /catalog/datasets
    query: {limit: 1, select: dataset_id}
    curl: "curl 'https://northernpowergrid.opendatasoft.com/api/explore/v2.1/catalog/datasets?limit=1&select=dataset_id'"
  response:
    status: 200
    abridged: false
    body:
      total_count: 102
      results:
      - dataset_id: combined-authority-boundaries
  note: total_count is the honest size of the open data programme — 102 datasets on this date.
- name: Browse the catalogue by theme
  operationId: getDatasetsFacets
