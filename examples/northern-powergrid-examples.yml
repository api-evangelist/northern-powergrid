- name: Aggregate with ODSQL group_by
  operationId: getRecords
  request:
    method: GET
    path: /catalog/datasets/live-power-cuts-data/records
    query: {select: powercutcategory, group_by: powercutcategory, limit: 10}
    curl: "curl 'https://northernpowergrid.opendatasoft.com/api/explore/v2.1/catalog/datasets/live-power-cuts-data/records?select=powercutcategory&group_by=powercutcategory&limit=10'"
  response:
    status: 200
    abridged: true
    body:
      total_count: 10
      results:
      - {powercutcategory: '10'}
      - {powercutcategory: 'Damaged LV U/G'}
      - {powercutcategory: 'HV Restoration'}
  note: Server-side aggregation, no client-side rollup needed — the group_by cap is 20,000 rows.
- name: Malformed ODSQL
  operationId: getDatasets
  request:
    method: GET
    path: /catalog/datasets
    query: {where: 'BADSYNTAX(('}
    curl: "curl 'https://northernpowergrid.opendatasoft.com/api/explore/v2.1/catalog/datasets?where=BADSYNTAX(('"
  response:
    status: 400
    abridged: false
    body:
      error_code: ODSQLSyntaxError
      message: "ODSQL syntax exception: unexpected ( at position 9 in BADSYNTAX((. Clause(s) containing the error(s): where."
  note: The error names the clause and the character offset — cheap to debug, easy for an agent to correct.
- name: Unknown dataset
  operationId: getDataset
  request:
    method: GET
    path: /catalog/datasets/nonexistent-dataset-xyz
    curl: "curl 'https://northernpowergrid.opendatasoft.com/api/explore/v2.1/catalog/datasets/nonexistent-dataset-xyz'"
  response:
    status: 404
    abridged: false
    body:
      error_code: NotFoundResource
      message: "The requested dataset nonexistent-dataset-xyz does not exist."
  note: 404 is returned in practice but is declared on no operation in the OpenAPI.
