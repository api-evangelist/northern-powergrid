note: >-
  Northern Powergrid itself publishes no client library. Its Open Data Explore API is the standard
  Opendatasoft (Huwise) Explore API v2.1, and the platform operator maintains a first-party,
  MIT-licensed TypeScript/JavaScript client for exactly that API — usable against this portal by
  pointing it at northernpowergrid.opendatasoft.com. Those packages are recorded below with
  official: false (they are not Northern Powergrid artifacts) and platform_official: true (they are
  first-party to the platform that serves this API). Nothing was found on PyPI, Packagist, RubyGems,
  pkg.go.dev, crates.io, NuGet or Maven Central.
